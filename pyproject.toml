[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-aggregator"
version = "0.1.0"
description = "MCP composition layer for diagnostic tooling across orchestration and infrastructure platforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Randall Carlisle", email = "cisolutionsinc@gmail.com" },
]
keywords = ["mcp", "fastmcp", "support-engineering", "diagnostics", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.13.0,<3.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
support-aggregator = "support_aggregator.server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "support-aggregator[test]",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_aggregator"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/support_aggregator --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
